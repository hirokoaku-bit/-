<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  background:linear-gradient(168deg,#fffdf9 0%,#fdf4e7 100%);color:#1B2A4A;position:relative;
  word-break:keep-all;line-break:strict}

.head{text-align:center;padding:56px 0 0}
.head h1{font-size:60px;font-weight:900;letter-spacing:.02em;display:inline-block}
.head .o{color:#f5822b}
.head .ul{position:relative}
.head .ul::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:8px;background:#fbcf9e;border-radius:5px;z-index:-1}

.card{position:relative;background:#fff;border:2.5px solid #f4b271;border-radius:24px;
  padding:34px 26px 24px;box-shadow:0 12px 26px rgba(190,130,50,.10)}
.badge{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:54px;height:54px;
  border-radius:50%;background:#f5822b;color:#fff;font-size:28px;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(0,0,0,.14)}
.ic{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:#fdecda;color:#f5822b;
  display:flex;align-items:center;justify-content:center}
.ic svg{width:52px;height:52px}
.name{font-size:30px;font-weight:900;text-align:center;margin-bottom:12px}
.card p{font-size:19px;font-weight:600;line-height:1.7;color:#41495c;text-align:center}
.em{color:#f5822b;font-weight:900}
.arrow{display:flex;align-items:center;color:#f5822b}
.arrow svg{width:44px;height:44px}

.foot{position:absolute;left:60px;right:60px;bottom:44px;background:#f5822b;border-radius:22px;
  padding:22px 0;text-align:center;color:#fff;font-size:34px;font-weight:900;
  box-shadow:0 10px 22px rgba(245,130,43,.28);display:flex;align-items:center;justify-content:center;gap:16px}
.foot .navy{color:#1B2A4A}
.foot .ck{width:50px;height:50px;border-radius:50%;background:#1B2A4A;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.foot .ck svg{width:28px;height:28px}
</style></head><body>

<div class="head"><h1>ほうれい線ケア、<span class="ul">口を動かす</span><span class="o">3ステップ</span></h1></div>

<div style="display:flex;justify-content:center;align-items:center;gap:22px;padding:80px 60px 0">
  <div class="card" style="width:400px">
    <div class="badge">1</div>
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><ellipse cx="24" cy="24" rx="14" ry="18" stroke="currentColor" stroke-width="3"/><path d="M17 20c2 3 12 3 14 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="name">あ・い・う・べ体操</div>
    <p>大きく口を動かして<br><span class="em">10回×2〜3セット</span></p>
  </div>
  <div class="arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h16M13 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="card" style="width:400px">
    <div class="badge">2</div>
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="3"/><path d="M17 24h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="name">頬をふくらませる</div>
    <p>空気を左右に<br><span class="em">5秒ずつ・5往復</span></p>
  </div>
  <div class="arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h16M13 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="card" style="width:400px">
    <div class="badge">3</div>
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><ellipse cx="24" cy="26" rx="10" ry="6" stroke="currentColor" stroke-width="3"/></svg></div>
    <div class="name">「う」の形をキープ</div>
    <p>5秒キープしてゆるめる<br><span class="em">を5回</span></p>
  </div>
</div>

<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span class="navy">強くこすらない。</span>動かす回数を積み重ねる
</div>

</body></html>
