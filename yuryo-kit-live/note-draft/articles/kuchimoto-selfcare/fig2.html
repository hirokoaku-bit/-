<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  background:linear-gradient(168deg,#fffdf9 0%,#fdf4e7 100%);color:#1B2A4A;position:relative;
  word-break:keep-all;line-break:strict}

.head{text-align:center;padding:56px 0 0}
.head h1{font-size:58px;font-weight:900;letter-spacing:.02em;display:inline-block}
.head .o{color:#f5822b}
.head .ul{position:relative}
.head .ul::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:8px;background:#fbcf9e;border-radius:5px;z-index:-1}

.card{position:relative;background:#fff;border:2.5px solid #f4b271;border-radius:26px;
  padding:34px 30px;box-shadow:0 12px 26px rgba(190,130,50,.10);width:480px}
.label{display:inline-block;padding:8px 22px;border-radius:999px;font-size:20px;font-weight:900;color:#fff;margin-bottom:18px}
.ic{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:#fdecda;color:#f5822b;
  display:flex;align-items:center;justify-content:center}
.ic svg{width:58px;height:58px}
.name{font-size:30px;font-weight:900;text-align:center;margin-bottom:12px}
.card p{font-size:19px;font-weight:600;line-height:1.7;color:#41495c;text-align:center}
.em{color:#f5822b;font-weight:900}
.plus{font-size:56px;font-weight:900;color:#f5822b}

.foot{position:absolute;left:60px;right:60px;bottom:44px;background:#f5822b;border-radius:22px;
  padding:22px 0;text-align:center;color:#fff;font-size:32px;font-weight:900;
  box-shadow:0 10px 22px rgba(245,130,43,.28);display:flex;align-items:center;justify-content:center;gap:16px}
.foot .navy{color:#1B2A4A}
.foot .ck{width:50px;height:50px;border-radius:50%;background:#1B2A4A;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.foot .ck svg{width:28px;height:28px}
</style></head><body>

<div class="head"><h1>口元の老化は<span class="o">2つの原因</span>が<span class="ul">重なる</span></h1></div>

<div style="display:flex;justify-content:center;align-items:center;gap:36px;padding:70px 60px 0">
  <div class="card" style="text-align:center">
    <div class="label" style="background:#9CA3AF">原因1</div>
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><ellipse cx="24" cy="24" rx="14" ry="18" stroke="currentColor" stroke-width="3"/><path d="M18 18v10M30 18v10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="name">歯の色</div>
    <p>飲食物の着色や<br>毎日のケア習慣で変わる</p>
  </div>
  <div class="plus">+</div>
  <div class="card" style="text-align:center">
    <div class="label" style="background:#f5822b">原因2</div>
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="3"/><path d="M17 28c3 3 11 3 14 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="name">表情筋・皮膚</div>
    <p>筋肉の使い方のクセと<br>乾燥・ハリの変化</p>
  </div>
</div>

<div class="foot">
  <span class="ck"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  どちらも<span class="navy">毎日の習慣</span>で変えられる
</div>

</body></html>
